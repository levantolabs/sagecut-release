# SageCut gate question bank (v1). Every question is a yes/no or a scale question that Sage answers about ONE prepared picture:
# a settled frame, a phone-size frame, a contact sheet of one beat, or a difference image of two frames.
# A fail answer is a finding. A null answer, or a scale answer within `escalate margin` of the pass line, is an escalation.
# Questions marked escalate_only never make a finding. {expected_order} is filled from the schedule.
defaults:
  escalate:
    - null_answer
    - scale_within_0.3_of_pass
questions:
  - id: staging_order
    kind: yesno
    image: sheet
    instructions: >-
      Cells are in time order, labelled with frame numbers. Expected order: {expected_order}.
      Does each element finish arriving before the next one starts, in that order?
    fail: 'no'
    severity: major
  - id: dead_frame
    kind: yesno
    image: frame
    instructions: >-
      Is this frame essentially empty: a flat background with at most one small mark and nothing
      a viewer can read?
    fail: 'yes'
    severity: minor
  - id: pop
    kind: yesno
    image: diff
    instructions: >-
      This is a difference image of two consecutive frames inside a transition (not a hard cut).
      Bright areas changed between the two frames. Does a large part of the picture change in this single
      step, so that it would read as a pop or glitch instead of smooth motion?
    fail: 'yes'
    severity: major
  - id: abrupt_change
    kind: yesno
    image: diff
    instructions: >-
      This is a difference image of two frames a few milliseconds apart. Bright areas changed.
      Does a large part of the picture change at once (a pop or a hard fill), instead of a small object
      moving?
    fail: 'yes'
    severity: major
  - id: overlap
    kind: yesno
    image: frame
    instructions: >-
      Does any text sit on top of other text or on a busy graphic so that a word is hard to
      read, or does a moving shape or card cross a label?
    fail: 'yes'
    severity: major
  - id: legible_feed
    kind: yesno
    image: test_width
    instructions: >-
      This frame is shown at phone-feed size. Ignore decorative text that is part of an object, texture
      or background. All other on-screen text counts, including small labels, tags and numbers.
      Can every word of that text be read without zooming? Answer no if any such word
      is blurred, merged with another line, or too small.
    fail: 'no'
    severity: blocker
  - id: text_integrity
    kind: yesno
    image: frame
    instructions: >-
      Is any on-screen word partly hidden, split into two colours, overlapped by another word,
      or followed by a stray fragment of text, so that a word could be misread as another word or looks
      broken?
    fail: 'yes'
    severity: major
  - id: hierarchy
    kind: scale
    image: frame
    instructions: How clear is the reading order of this frame?
    levels:
      - { level: 0, description: No clear entry point; elements compete equally }
      - { level: 1, description: Entry point exists but second read is ambiguous }
      - { level: 2, description: Readable order, but two tiers look nearly the same size or weight }
      - { level: 3, description: Clear order; tiers distinct; minor crowding }
      - { level: 4, description: One obvious read path; tiers clearly separated by size, weight and space }
    pass_at_least: 3
    severity: major
    escalate_only: true
